name: Extrair arquivos do ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "recargabux_extraido_pronto.zip"

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair ZIP
        run: |
          test -f recargabux_extraido_pronto.zip
          unzip -o recargabux_extraido_pronto.zip -d .

      - name: Salvar arquivos extraídos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi
          git commit -m "Extrai arquivos do pacote ZIP"
          git push
